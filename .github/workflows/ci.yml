name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran make libfcgi-dev libsqlite3-dev nginx spawn-fcgi curl

      - name: Build (strict, -Werror)
        run: make

      - name: Unit tests
        run: make test

      - name: End-to-end (nginx + spawn-fcgi)
        run: make e2e
