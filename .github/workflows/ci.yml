name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran make libsqlite3-dev libfcgi-dev libfcgi-bin spawn-fcgi
      - name: Build (strict, runtime checks)
        run: make DEBUG=1 WERROR=1
      - name: Unit tests
        run: make test DEBUG=1 WERROR=1
      - name: FastCGI smoke test
        run: make smoke DEBUG=1 WERROR=1

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fortran-io .
      - name: Serve through nginx
        run: |
          docker run -d --name fortran-io -p 8080:8080 fortran-io
          for i in $(seq 1 20); do curl -fs localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q 'Setup Guide'
          curl -fs 'localhost:8080/search?q=koala' | grep -q 'Phascolarctos cinereus'
          curl -fs localhost:8080/all | grep -q 'Vombatus ursinus'
          curl -fs localhost:8080/static/model.html | grep -q 'marsupial_t'
