name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: gfortran on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make libfcgi-dev libsqlite3-dev nginx spawn-fcgi
      - name: Unit tests (runtime checks + sanitizers)
        run: make test FFLAGS="-O0 -g -fcheck=all -fbacktrace -fsanitize=address,undefined"
      - name: Build
        run: make clean && make
      - name: Smoke test (nginx + spawn-fcgi)
        run: make smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fortran-io .
      - name: Run and probe
        run: |
          docker run -d --name app -p 8080:8080 fortran-io
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS 'http://127.0.0.1:8080/search?q=koala' | grep -q 'Phascolarctos cinereus'
      - name: Container logs
        if: always()
        run: docker logs app || true
