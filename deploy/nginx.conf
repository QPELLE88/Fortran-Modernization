# Fortran.io site for nginx. Copy into /etc/nginx/sites-available/ (or include it)
# and set `root` to your checkout. Static files are served by nginx; everything
# else goes to the FastCGI process started with spawn-fcgi on 127.0.0.1:9000.
server {
    listen 80;
    server_name _;
    root /home/fortran/fortran-machine;

    client_max_body_size 64k;

    location /static/ {
        try_files $uri =404;
    }

    location / {
        include fastcgi_params;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_pass 127.0.0.1:9000;
    }
}
